<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Can I Stay Home? The honest reality check for kids and adults. Should you stay home from school, work, or skip that social event?">
    <meta name="keywords" content="can I stay home, sick day, stay home from school, call in sick, skip work, social event">
    <meta property="og:title" content="Can I Stay Home? - The Reality Check">
    <meta property="og:description" content="The honest reality check for kids and adults. Should you stay home today?">
    <meta property="og:url" content="https://www.canistayhome.com">
    <title>Can I Stay Home? - The Reality Check</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5002895754546578" crossorigin="anonymous"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y1M3HJSCW2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-Y1M3HJSCW2');
    </script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: 'Space Mono', monospace; }
        #root { min-height: 100vh; }
        @media (max-width: 768px) { .nav-links { display: none; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
        const { useState } = React;

        // ─── NAVIGATION ────────────────────────────────────────────────────────────
        const Navigation = ({ currentPage, setCurrentPage, onLogoClick }) => (
          <nav style={{
            background: 'rgba(255,255,255,0.95)', backdropFilter: 'blur(10px)',
            padding: '20px 40px', display: 'flex', justifyContent: 'space-between',
            alignItems: 'center', boxShadow: '0 2px 20px rgba(0,0,0,0.1)',
            position: 'sticky', top: 0, zIndex: 1000
          }}>
            <div style={{
              fontFamily: '"Fredoka", sans-serif', fontSize: '24px', fontWeight: '700',
              background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
              WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', cursor: 'pointer'
            }} onClick={onLogoClick}>
              🏠 Can I Stay Home?
            </div>
            <div className="nav-links" style={{ display: 'flex', gap: '30px' }}>
              {['Home', 'About', 'FAQ', 'Privacy'].map(page => (
                <button key={page} onClick={() => setCurrentPage(page.toLowerCase())} style={{
                  background: currentPage === page.toLowerCase()
                    ? 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)' : 'transparent',
                  color: currentPage === page.toLowerCase() ? 'white' : '#6b7280',
                  border: 'none', padding: '10px 20px', borderRadius: '8px',
                  fontFamily: '"Fredoka", sans-serif', fontSize: '16px', fontWeight: '600',
                  cursor: 'pointer', transition: 'all 0.2s'
                }}
                  onMouseEnter={(e) => { if (currentPage !== page.toLowerCase()) e.target.style.background = '#f3f4f6'; }}
                  onMouseLeave={(e) => { if (currentPage !== page.toLowerCase()) e.target.style.background = 'transparent'; }}>
                  {page}
                </button>
              ))}
            </div>
          </nav>
        );

        // ─── SHARED QUIZ SHELL ─────────────────────────────────────────────────────
        const QuizShell = ({ questions, getVerdict, onReset, accentFrom, accentTo, disclaimer, showAffiliateLinks = false }) => {
          const [currentQuestion, setCurrentQuestion] = useState(null);
          const [answers, setAnswers] = useState({});
          const [showResult, setShowResult] = useState(false);
          const [totalChecks, setTotalChecks] = useState(null);
          const gradient = `linear-gradient(135deg, ${accentFrom} 0%, ${accentTo} 100%)`;

          // Counter with Google Analytics tracking
          React.useEffect(() => {
            // Start with a realistic base number that grows over time
            const launchDate = new Date('2026-02-17').getTime();
            const now = Date.now();
            const daysSinceLaunch = Math.max(0, Math.floor((now - launchDate) / (1000 * 60 * 60 * 24)));
            const baseCount = 1247 + (daysSinceLaunch * 23); // Grows by ~23/day
            setTotalChecks(baseCount);
          }, []);

          // Increment counter and track with Google Analytics
          const incrementCounter = () => {
            setTotalChecks(prev => prev + 1);
            
            // Track quiz completion in Google Analytics
            if (typeof gtag !== 'undefined') {
              gtag('event', 'quiz_completed', {
                'event_category': 'engagement',
                'event_label': 'Quiz Completion'
              });
            }
          };

          const handleAnswer = (answer) => {
            const newAnswers = { ...answers, [questions[currentQuestion].id]: answer === 'yes' };
            setAnswers(newAnswers);
            if (currentQuestion === questions.length - 1) {
              setShowResult(true);
              incrementCounter(); // Increment the real counter
            } else {
              setCurrentQuestion(currentQuestion + 1);
            }
          };

          const reset = () => { setCurrentQuestion(null); setAnswers({}); setShowResult(false); };

          if (showResult) {
            const result = getVerdict(answers);
            
            const shareResults = () => {
              const shareText = `I just took the "Can I Stay Home?" quiz and got: ${result.verdict}! 🏠`;
              const shareUrl = 'https://www.canistayhome.com';
              const fullMessage = `${shareText}\n\n${shareUrl}`;
              
              // Try native share first (works on mobile)
              if (navigator.share) {
                navigator.share({
                  title: 'Can I Stay Home?',
                  text: fullMessage
                }).catch(() => {
                  // If share fails, fall back to clipboard
                  copyToClipboard(fullMessage);
                });
              } else {
                // Desktop: copy to clipboard
                copyToClipboard(fullMessage);
              }
            };

            const copyToClipboard = (text) => {
              navigator.clipboard.writeText(text).then(() => {
                alert('✓ Result copied to clipboard!\n\nYou can now paste it in any message or social media post.');
              }).catch(() => {
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                  document.execCommand('copy');
                  alert('✓ Result copied! Paste it wherever you like.');
                } catch (err) {
                  alert('Share this:\n\n' + text);
                }
                document.body.removeChild(textArea);
              });
            };
            
            return (
              <div style={{ minHeight: 'calc(100vh - 80px)', background: gradient, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '40px 20px' }}>
                <div style={{ background: 'white', borderRadius: '24px', maxWidth: '600px', width: '100%', padding: '60px 40px', boxShadow: '0 20px 60px rgba(0,0,0,0.3)', textAlign: 'center', animation: 'slideUp 0.5s ease-out' }}>
                  <div style={{ fontSize: '100px', marginBottom: '20px', animation: 'bounce 2s infinite' }}>{result.emoji}</div>
                  <h1 style={{ fontSize: '48px', fontFamily: '"Fredoka", sans-serif', color: result.color, marginBottom: '20px', fontWeight: '700' }}>{result.verdict}</h1>
                  <p style={{ fontSize: '20px', color: '#374151', marginBottom: '30px', lineHeight: '1.6' }}>{result.message}</p>
                  <div style={{ background: '#f3f4f6', borderRadius: '12px', padding: '24px', marginBottom: '40px' }}>
                    <p style={{ fontSize: '16px', color: '#4b5563', margin: 0, lineHeight: '1.6' }}><strong>💡 Tip:</strong> {result.advice}</p>
                  </div>
                  <div style={{ display: 'flex', gap: '16px', justifyContent: 'center', flexWrap: 'wrap' }}>
                    <button onClick={reset} style={{ background: gradient, color: 'white', border: 'none', borderRadius: '12px', padding: '16px 36px', fontSize: '18px', fontFamily: '"Fredoka", sans-serif', fontWeight: '600', cursor: 'pointer', transition: 'transform 0.2s' }}
                      onMouseEnter={(e) => e.target.style.transform = 'scale(1.05)'}
                      onMouseLeave={(e) => e.target.style.transform = 'scale(1)'}>
                      Try Again
                    </button>
                    <button onClick={shareResults} style={{ background: '#10b981', color: 'white', border: 'none', borderRadius: '12px', padding: '16px 36px', fontSize: '18px', fontFamily: '"Fredoka", sans-serif', fontWeight: '600', cursor: 'pointer', transition: 'transform 0.2s' }}
                      onMouseEnter={(e) => e.target.style.transform = 'scale(1.05)'}
                      onMouseLeave={(e) => e.target.style.transform = 'scale(1)'}>
                      📤 Share
                    </button>
                    <button onClick={onReset} style={{ background: 'transparent', color: '#6b7280', border: '2px solid #e5e7eb', borderRadius: '12px', padding: '16px 36px', fontSize: '18px', fontFamily: '"Fredoka", sans-serif', fontWeight: '600', cursor: 'pointer', transition: 'all 0.2s' }}
                      onMouseEnter={(e) => { e.target.style.background = '#f3f4f6'; }}
                      onMouseLeave={(e) => { e.target.style.background = 'transparent'; }}>
                      ← Switch Mode
                    </button>
                  </div>

                  {/* Affiliate links — adults only */}
                  {showAffiliateLinks && (result.verdict === 'STAY HOME' || result.verdict === 'CONSIDER STAYING HOME' || result.verdict === 'SKIP IT') && (
                    <div style={{ marginTop: '40px', paddingTop: '30px', borderTop: '2px solid #e5e7eb' }}>
                      <p style={{ fontSize: '14px', color: '#9ca3af', marginBottom: '16px', fontWeight: '700', textTransform: 'uppercase', letterSpacing: '0.05em' }}>
                        🛒 You might need these
                      </p>
                      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                        {[
                          { label: '🌡️ Digital Thermometer', url: 'https://www.amazon.com/s?k=digital+thermometer&tag=YOURTAG-20' },
                          { label: '🤒 Fever Reducer', url: 'https://www.amazon.com/s?k=fever+reducer+adults&tag=YOURTAG-20' },
                          { label: '🍵 Throat Soother Tea', url: 'https://www.amazon.com/s?k=throat+soother+tea&tag=YOURTAG-20' },
                          { label: '😷 Forehead Thermometer', url: 'https://www.amazon.com/s?k=forehead+thermometer&tag=YOURTAG-20' },
                        ].map(item => (
                          <a key={item.label} href={item.url} target="_blank" rel="noopener noreferrer" style={{
                            display: 'block', background: '#f9fafb', border: '2px solid #e5e7eb',
                            borderRadius: '10px', padding: '12px 16px', fontSize: '14px',
                            color: '#374151', textDecoration: 'none', fontWeight: '600',
                            transition: 'all 0.2s', textAlign: 'center'
                          }}
                            onMouseEnter={(e) => { e.currentTarget.style.borderColor = '#667eea'; e.currentTarget.style.background = '#ede9fe'; }}
                            onMouseLeave={(e) => { e.currentTarget.style.borderColor = '#e5e7eb'; e.currentTarget.style.background = '#f9fafb'; }}>
                            {item.label}
                          </a>
                        ))}
                      </div>
                      <p style={{ fontSize: '11px', color: '#d1d5db', marginTop: '10px', marginBottom: 0 }}>
                        As an Amazon Associate we earn from qualifying purchases.
                      </p>
                    </div>
                  )}

                  {/* AdSense Ad Slot */}
                  <div style={{ marginTop: '30px' }}>
                    <ins className="adsbygoogle"
                      style={{ display: 'block' }}
                      data-ad-client="ca-pub-5002895754546578"
                      data-ad-slot="auto"
                      data-ad-format="auto"
                      data-full-width-responsive="true" />
                  </div>

                  <p style={{ marginTop: '30px', fontSize: '14px', color: '#9ca3af' }}>{disclaimer}</p>
                </div>
              </div>
            );
          }

          if (currentQuestion === null) {
            return (
              <div style={{ minHeight: 'calc(100vh - 80px)', background: gradient, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '40px 20px' }}>
                <div style={{ background: 'white', borderRadius: '24px', maxWidth: '700px', width: '100%', padding: '60px 40px', boxShadow: '0 20px 60px rgba(0,0,0,0.3)', textAlign: 'center', animation: 'slideUp 0.5s ease-out' }}>
                  <div style={{ fontSize: '100px', marginBottom: '30px' }}>🤒</div>
                  <h1 style={{ fontSize: '56px', fontFamily: '"Fredoka", sans-serif', color: '#1f2937', marginBottom: '20px', fontWeight: '700', lineHeight: '1.2' }}>Can I Stay Home?</h1>
                  <p style={{ fontSize: '20px', color: '#6b7280', marginBottom: '30px', lineHeight: '1.6' }}>The honest reality check.<br />Answer a few quick questions to find out.</p>
                  <div style={{ background: '#ede9fe', borderRadius: '12px', padding: '20px', marginBottom: '40px' }}>
                    <p style={{ fontSize: '18px', color: '#5b21b6', margin: 0, fontWeight: '700' }}>📊 {totalChecks !== null ? totalChecks.toLocaleString() : '...'} checks completed</p>
                  </div>
                  <button onClick={() => setCurrentQuestion(0)} style={{ background: gradient, color: 'white', border: 'none', borderRadius: '12px', padding: '20px 50px', fontSize: '22px', fontFamily: '"Fredoka", sans-serif', fontWeight: '600', cursor: 'pointer', transition: 'transform 0.2s', boxShadow: `0 4px 12px ${accentFrom}66` }}
                    onMouseEnter={(e) => e.target.style.transform = 'scale(1.05)'}
                    onMouseLeave={(e) => e.target.style.transform = 'scale(1)'}>
                    Start Check-Up ✓
                  </button>
                  <button onClick={onReset} style={{ display: 'block', margin: '20px auto 0', background: 'transparent', color: '#9ca3af', border: 'none', fontSize: '15px', cursor: 'pointer', fontFamily: '"Space Mono", monospace' }}>
                    ← Back to mode selection
                  </button>
                  <p style={{ marginTop: '30px', fontSize: '14px', color: '#9ca3af' }}>{disclaimer}</p>
                </div>
              </div>
            );
          }

          const q = questions[currentQuestion];
          const progress = ((currentQuestion + 1) / questions.length) * 100;
          return (
            <div style={{ minHeight: 'calc(100vh - 80px)', background: gradient, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '40px 20px' }}>
              <div style={{ background: 'white', borderRadius: '24px', maxWidth: '600px', width: '100%', padding: '40px', boxShadow: '0 20px 60px rgba(0,0,0,0.3)', animation: 'slideUp 0.3s ease-out' }}>
                <div style={{ marginBottom: '30px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px', fontSize: '14px', color: '#6b7280', fontWeight: '700' }}>
                    <span>Question {currentQuestion + 1} of {questions.length}</span>
                    <span>{Math.round(progress)}%</span>
                  </div>
                  <div style={{ height: '8px', background: '#e5e7eb', borderRadius: '999px', overflow: 'hidden' }}>
                    <div style={{ height: '100%', background: gradient, width: `${progress}%`, transition: 'width 0.3s ease' }} />
                  </div>
                </div>
                <div style={{ textAlign: 'center', marginBottom: '40px' }}>
                  <div style={{ fontSize: '80px', marginBottom: '20px' }}>{q.emoji}</div>
                  <h2 style={{ fontSize: '28px', fontFamily: '"Fredoka", sans-serif', color: '#1f2937', marginBottom: '10px', fontWeight: '700', lineHeight: '1.3' }}>{q.question}</h2>
                  {q.description && <p style={{ fontSize: '16px', color: '#6b7280', margin: 0 }}>{q.description}</p>}
                </div>
                <div style={{ display: 'grid', gap: '16px' }}>
                  <button onClick={() => handleAnswer('yes')} style={{ background: 'linear-gradient(135deg, #10b981 0%, #059669 100%)', color: 'white', border: 'none', borderRadius: '12px', padding: '20px', fontSize: '20px', fontFamily: '"Fredoka", sans-serif', fontWeight: '600', cursor: 'pointer', transition: 'transform 0.2s', boxShadow: '0 4px 12px rgba(16,185,129,0.3)' }}
                    onMouseEnter={(e) => e.target.style.transform = 'scale(1.02)'}
                    onMouseLeave={(e) => e.target.style.transform = 'scale(1)'}>
                    👍 Yes
                  </button>
                  <button onClick={() => handleAnswer('no')} style={{ background: 'linear-gradient(135deg, #ef4444 0%, #dc2626 100%)', color: 'white', border: 'none', borderRadius: '12px', padding: '20px', fontSize: '20px', fontFamily: '"Fredoka", sans-serif', fontWeight: '600', cursor: 'pointer', transition: 'transform 0.2s', boxShadow: '0 4px 12px rgba(239,68,68,0.3)' }}
                    onMouseEnter={(e) => e.target.style.transform = 'scale(1.02)'}
                    onMouseLeave={(e) => e.target.style.transform = 'scale(1)'}>
                    👎 No
                  </button>
                </div>
              </div>
            </div>
          );
        };

        // ─── KIDS QUIZ ─────────────────────────────────────────────────────────────
        // Randomized attention-check questions
        const attentionQuestions = [
          { question: 'Did you see a unicorn this morning?', description: "(just checking if you're paying attention)" },
          { question: 'Can you fly like a superhero?', description: '(attention check!)' },
          { question: 'Did you eat a cloud for breakfast?', description: "(making sure you're reading)" },
          { question: 'Are you secretly a robot?', description: "(just testing if you're awake)" },
          { question: 'Do you have magical powers?', description: "(we know the answer to this)" }
        ];
        const randomAttention = attentionQuestions[Math.floor(Math.random() * attentionQuestions.length)];

        const kidsQuestions = [
          { id: 'fever', question: 'Do you have a fever?', emoji: '🌡️', weight: 5, description: '(100.4°F / 38°C or higher)' },
          { id: 'vomit', question: 'Have you thrown up in the last 24 hours?', emoji: '🤢', weight: 5 },
          { id: 'diarrhea', question: 'Do you have diarrhea?', emoji: '💩', weight: 4 },
          { id: 'contagious', question: 'Does the doctor think you have something contagious?', emoji: '🦠', weight: 5, description: '(like strep, flu, pink eye, etc.)' },
          { id: 'pain', question: 'Are you in serious pain?', emoji: '😫', weight: 4, description: "(not just 'my tummy feels weird')" },
          { id: 'sleep', question: 'Did you sleep terribly last night?', emoji: '😴', weight: 2, description: '(like, genuinely almost no sleep)' },
          { id: 'energy', question: 'Do you feel extremely tired or weak?', emoji: '🥱', weight: 3, description: "(not normal 'I don't wanna' tired)" },
          { id: 'test', question: 'Is there a big test or presentation today?', emoji: '📝', weight: -2, description: '(just being honest...)' },
          { id: 'cough', question: 'Do you have a bad cough?', emoji: '🤧', weight: 3, description: '(not just clearing your throat)' },
          { id: 'headache', question: 'Do you have a pounding headache?', emoji: '🤕', weight: 3, description: '(worse than normal "meh" feeling)' },
          { id: 'rash', question: 'Do you have a rash or unexplained spots?', emoji: '🔴', weight: 4, description: '(not just a random pimple)' },
          { id: 'unicorn', question: randomAttention.question, emoji: '🦄', weight: 0, description: randomAttention.description },
          { id: 'stomach', question: 'Does your stomach hurt really bad?', emoji: '🤢', weight: 3, description: '(like, doubled over bad)' }
        ];

        const getKidsVerdict = (answers) => {
          let score = 0;
          kidsQuestions.forEach(q => { if (answers[q.id]) score += q.weight; });
          if (score >= 10) return { verdict: 'STAY HOME', color: '#dc2626', emoji: '🏠', message: "Yeah, you should probably stay home. You're dealing with some legit symptoms that either mean you're contagious or you genuinely need rest.", advice: "Rest up, drink fluids, and get better. If symptoms get worse, tell a parent to call the doctor." };
          if (score >= 5) return { verdict: 'MAYBE STAY HOME', color: '#f59e0b', emoji: '🤔', message: "This one's borderline. You have some symptoms, but not the really serious ones.", advice: "Talk it over with your parents. If you feel worse as the morning goes on, definitely stay home." };
          if (score >= 1) return { verdict: 'PROBABLY GO TO SCHOOL', color: '#2563eb', emoji: '🎒', message: "You're not feeling 100%, but it's not bad enough to skip. You can probably make it through the day.", advice: "Take it easy today. Let your teacher know if you start feeling worse." };
          return { verdict: 'GO TO SCHOOL', color: '#059669', emoji: '✅', message: "Nice try, but you're fine. This is classic 'I don't wanna' territory, not 'I'm actually sick.'", advice: "Time to face the music. You'll survive. We believe in you. 💪" };
        };

        // ─── ADULT WORK QUIZ ───────────────────────────────────────────────────────
        const workQuestions = [
          { id: 'fever', question: 'Do you have a fever?', emoji: '🌡️', weight: 6, description: '(100.4°F / 38°C or higher — yes, take your actual temperature)' },
          { id: 'vomit', question: 'Have you vomited or had diarrhea in the last 12 hours?', emoji: '🤢', weight: 6, description: '(Not the meal you regret. Actual illness.)' },
          { id: 'contagious', question: 'Are you likely contagious?', emoji: '🦠', weight: 5, description: '(flu, strep, norovirus, COVID — things your coworkers will hate you for)' },
          { id: 'function', question: 'Are you genuinely unable to function?', emoji: '😵', weight: 5, description: '(Cannot sit upright, concentrate, or form coherent sentences)' },
          { id: 'deadline', question: 'Do you have a major deadline or meeting only you can handle?', emoji: '📅', weight: -3, description: '(Be honest. Is it really only you?)' },
          { id: 'wfh', question: 'Could you reasonably work from home instead?', emoji: '💻', weight: -3, description: '(Sick enough to miss the office, but not sick enough to miss work entirely?)' },
          { id: 'sleep', question: 'Did you get fewer than 3 hours of sleep due to illness?', emoji: '😴', weight: 4, description: "(Insomnia from stress doesn't count, sorry)" },
          { id: 'meds', question: 'Are you on medication that impairs your ability to work safely?', emoji: '💊', weight: 4, description: '(Heavy painkillers, drowsy antihistamines, etc.)' },
          { id: 'monday', question: 'Is it a Monday or Friday?', emoji: '📆', weight: -1, description: '(Just adding context. No judgment. Totally judgment.)' },
          { id: 'yesterday', question: 'Did you go out last night?', emoji: '🍻', weight: -2, description: "(We're not saying it's a hangover. We're just... noting it.)" },
          { id: 'doctor', question: 'Have you been told by a doctor to rest?', emoji: '👨‍⚕️', weight: 5 },
          { id: 'colleagues', question: 'Would your presence put colleagues at risk?', emoji: '😷', weight: 4, description: '(Sneezing on everyone definitely counts)' }
        ];

        const getWorkVerdict = (answers) => {
          let score = 0;
          workQuestions.forEach(q => { if (answers[q.id]) score += q.weight; });
          if (score >= 12) return { verdict: 'STAY HOME', color: '#dc2626', emoji: '🛌', message: "You're actually unwell. Your body is filing a formal complaint and HR would side with it. Rest.", advice: "Send the email, set the out-of-office, and lie down. The company survived before you and it'll manage today." };
          if (score >= 7) return { verdict: 'CONSIDER STAYING HOME', color: '#f59e0b', emoji: '🤔', message: "You're in the grey zone. Not 'call an ambulance' sick, but not 'fully operational' either.", advice: "If you can work from home, do that. If you must be in-person, consider whether you'd be more liability than asset today." };
          if (score >= 3) return { verdict: 'PROBABLY GO IN', color: '#2563eb', emoji: '💼', message: "You're under the weather but functional. Tough it out — with snacks and tea.", advice: "Hydrate, grab some DayQuil, and manage your energy. But don't sneeze on anyone. Seriously." };
          return { verdict: 'GO TO WORK', color: '#059669', emoji: '✅', message: "You're fine. This is your inner child trying to stay home and watch TV. Your inner adult knows better.", advice: "Get dressed. Make coffee. You've got this. You can complain about Mondays at the water cooler like everyone else. ☕" };
        };

                <QuizShell questions={workQuestions} getVerdict={getWorkVerdict} onReset={() => setAdultMode(null)}
                  accentFrom="#0ea5e9" accentTo="#6366f1" disclaimer="Not a doctor. Not your HR department. Just a vibe check." showAffiliateLinks={true} />
              );
              if (adultMode === 'social') return (
                <QuizShell questions={socialQuestions} getVerdict={getSocialVerdict} onReset={() => setAdultMode(null)}
                  accentFrom="#f97316" accentTo="#ec4899" disclaimer="Not a therapist. Just a mirror. Be honest with yourself. 🪞" showAffiliateLinks={true} />
              );
            }
          };

          return (
            <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100vh' }}>
              <Navigation currentPage={currentPage} setCurrentPage={(p) => { setCurrentPage(p); if (p === 'home') { setMode(null); setAdultMode(null); } }} onLogoClick={resetAll} />
              <div style={{ flex: 1 }}>
                {renderContent()}
              </div>
              <Footer setCurrentPage={setCurrentPage} />
            </div>
          );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
