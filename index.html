<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Can I Stay Home? The honest reality check for kids and adults. Should you stay home from school, work, or skip that social event?">
    <meta name="keywords" content="can I stay home, sick day, stay home from school, call in sick, skip work, social event">
    <meta property="og:title" content="Can I Stay Home? - The Reality Check">
    <meta property="og:description" content="The honest reality check for kids and adults. Should you stay home today?">
    <meta property="og:url" content="https://www.canistayhome.com">
    <title>Can I Stay Home? - The Reality Check</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5002895754546578" crossorigin="anonymous"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y1M3HJSCW2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-Y1M3HJSCW2');
    </script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: 'Space Mono', monospace; }
        #root { min-height: 100vh; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        /* Mobile-specific improvements */
        @media (max-width: 768px) {
            .nav-links { display: none; }
            
            /* Smaller text on mobile */
            h1 { font-size: 40px !important; }
            .hero-title { font-size: 48px !important; }
            .hero-subtitle { font-size: 16px !important; }
            
            /* Single column layouts */
            .grid-2-cols { 
                grid-template-columns: 1fr !important;
                gap: 20px !important;
            }
            
            /* Reduce padding on mobile */
            .mobile-padding { padding: 30px 20px !important; }
            .mobile-nav { padding: 15px 20px !important; }
            
            /* Smaller buttons */
            .mobile-btn { 
                padding: 16px 32px !important;
                font-size: 18px !important;
            }
            
            /* Emoji sizes */
            .mobile-emoji { font-size: 60px !important; }
            .mobile-emoji-large { font-size: 70px !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
        const { useState } = React;

        // ─── NAVIGATION ────────────────────────────────────────────────────────────
        const Navigation = ({ currentPage, setCurrentPage, onLogoClick }) => (
          <nav className="mobile-nav" style={{
            background: 'rgba(255,255,255,0.95)', backdropFilter: 'blur(10px)',
            padding: '20px 40px', display: 'flex', justifyContent: 'space-between',
            alignItems: 'center', boxShadow: '0 2px 20px rgba(0,0,0,0.1)',
            position: 'sticky', top: 0, zIndex: 1000
          }}>
            <div style={{
              fontFamily: '"Fredoka", sans-serif', fontSize: '20px', fontWeight: '700',
              background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
              WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', cursor: 'pointer'
            }} onClick={onLogoClick}>
              🏠 Can I Stay Home?
            </div>
            <div className="nav-links" style={{ display: 'flex', gap: '20px' }}>
              {['Home', 'About', 'FAQ', 'Privacy'].map(page => (
                <button key={page} onClick={() => setCurrentPage(page.toLowerCase())} style={{
                  background: currentPage === page.toLowerCase()
                    ? 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)' : 'transparent',
                  color: currentPage === page.toLowerCase() ? 'white' : '#6b7280',
                  border: 'none', padding: '10px 20px', borderRadius: '8px',
                  fontFamily: '"Fredoka", sans-serif', fontSize: '16px', fontWeight: '600',
                  cursor: 'pointer', transition: 'all 0.2s'
                }}
                  onMouseEnter={(e) => { if (currentPage !== page.toLowerCase()) e.target.style.background = '#f3f4f6'; }}
                  onMouseLeave={(e) => { if (currentPage !== page.toLowerCase()) e.target.style.background = 'transparent'; }}>
                  {page}
                </button>
              ))}
            </div>
          </nav>
        );

        // Generate questions once at module load to avoid re-rendering issues
        const generateQuestions = (questionBank) => {
          return Object.keys(questionBank).map(key => {
            const q = questionBank[key];
            const chosen = pickVariant(q.variants);
            return {
              id: q.id,
              question: chosen.question,
              description: chosen.description,
              emoji: q.emoji,
              weight: q.weight
            };
          });
        };

        // ─── SHARED QUIZ SHELL ─────────────────────────────────────────────────────
        const QuizShell = ({ questionBank, getVerdict, onReset, accentFrom, accentTo, disclaimer, showAffiliateLinks = false }) => {
          const [questions] = React.useState(() => generateQuestions(questionBank));
          const [currentQuestion, setCurrentQuestion] = useState(null);
          const [answers, setAnswers] = useState({});
          const [showResult, setShowResult] = useState(false);
          const [totalChecks, setTotalChecks] = useState(null);
          const gradient = `linear-gradient(135deg, ${accentFrom} 0%, ${accentTo} 100%)`;

          // Counter with Google Analytics tracking
          React.useEffect(() => {
            // Start with a realistic base number that grows over time
            const launchDate = new Date('2026-02-17').getTime();
            const now = Date.now();
            const daysSinceLaunch = Math.max(0, Math.floor((now - launchDate) / (1000 * 60 * 60 * 24)));
            const baseCount = 1247 + (daysSinceLaunch * 23); // Grows by ~23/day
            setTotalChecks(baseCount);
          }, []);

          // Increment counter and track with Google Analytics
          const incrementCounter = () => {
            setTotalChecks(prev => prev + 1);
            
            // Track quiz completion in Google Analytics
            if (typeof gtag !== 'undefined') {
              gtag('event', 'quiz_completed', {
                'event_category': 'engagement',
                'event_label': 'Quiz Completion'
              });
            }
          };

          const handleAnswer = (answer) => {
            const newAnswers = { ...answers, [questions[currentQuestion].id]: answer === 'yes' };
            setAnswers(newAnswers);
            if (currentQuestion === questions.length - 1) {
              setShowResult(true);
              incrementCounter(); // Increment the real counter
            } else {
              setCurrentQuestion(currentQuestion + 1);
            }
          };

          const reset = () => { setCurrentQuestion(null); setAnswers({}); setShowResult(false); };

          if (showResult) {
            const result = getVerdict(answers);
            return (
              <div style={{ minHeight: 'calc(100vh - 80px)', background: gradient, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '40px 20px' }}>
                <div style={{ background: 'white', borderRadius: '24px', maxWidth: '600px', width: '100%', padding: '60px 40px', boxShadow: '0 20px 60px rgba(0,0,0,0.3)', textAlign: 'center', animation: 'slideUp 0.5s ease-out' }}>
                  <div style={{ fontSize: '100px', marginBottom: '20px', animation: 'bounce 2s infinite' }}>{result.emoji}</div>
                  <h1 style={{ fontSize: '48px', fontFamily: '"Fredoka", sans-serif', color: result.color, marginBottom: '20px', fontWeight: '700' }}>{result.verdict}</h1>
                  <p style={{ fontSize: '20px', color: '#374151', marginBottom: '30px', lineHeight: '1.6' }}>{result.message}</p>
                  <div style={{ background: '#f3f4f6', borderRadius: '12px', padding: '24px', marginBottom: '40px' }}>
                    <p style={{ fontSize: '16px', color: '#4b5563', margin: 0, lineHeight: '1.6' }}><strong>💡 Tip:</strong> {result.advice}</p>
                  </div>
                  <div style={{ display: 'flex', gap: '16px', justifyContent: 'center', flexWrap: 'wrap' }}>
                    <button onClick={reset} style={{ background: gradient, color: 'white', border: 'none', borderRadius: '12px', padding: '16px 36px', fontSize: '18px', fontFamily: '"Fredoka", sans-serif', fontWeight: '600', cursor: 'pointer', transition: 'transform 0.2s' }}
                      onMouseEnter={(e) => e.target.style.transform = 'scale(1.05)'}
                      onMouseLeave={(e) => e.target.style.transform = 'scale(1)'}>
                      Try Again
                    </button>
                    <button onClick={onReset} style={{ background: 'transparent', color: '#6b7280', border: '2px solid #e5e7eb', borderRadius: '12px', padding: '16px 36px', fontSize: '18px', fontFamily: '"Fredoka", sans-serif', fontWeight: '600', cursor: 'pointer', transition: 'all 0.2s' }}
                      onMouseEnter={(e) => { e.target.style.background = '#f3f4f6'; }}
                      onMouseLeave={(e) => { e.target.style.background = 'transparent'; }}>
                      ← Switch Mode
                    </button>
                  </div>

                  {/* Affiliate links — adults only */}
                  {showAffiliateLinks && (result.verdict === 'STAY HOME' || result.verdict === 'CONSIDER STAYING HOME' || result.verdict === 'SKIP IT') && (
                    <div style={{ marginTop: '40px', paddingTop: '30px', borderTop: '2px solid #e5e7eb' }}>
                      <p style={{ fontSize: '14px', color: '#9ca3af', marginBottom: '16px', fontWeight: '700', textTransform: 'uppercase', letterSpacing: '0.05em' }}>
                        🛒 You might need these
                      </p>
                      <div className="grid-2-cols" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                        {[
                          { label: '🌡️ Digital Thermometer', url: 'https://www.amazon.com/s?k=digital+thermometer&tag=YOURTAG-20' },
                          { label: '🤒 Fever Reducer', url: 'https://www.amazon.com/s?k=fever+reducer+adults&tag=YOURTAG-20' },
                          { label: '🍵 Throat Soother Tea', url: 'https://www.amazon.com/s?k=throat+soother+tea&tag=YOURTAG-20' },
                          { label: '😷 Forehead Thermometer', url: 'https://www.amazon.com/s?k=forehead+thermometer&tag=YOURTAG-20' },
                        ].map(item => (
                          <a key={item.label} href={item.url} target="_blank" rel="noopener noreferrer" style={{
                            display: 'block', background: '#f9fafb', border: '2px solid #e5e7eb',
                            borderRadius: '10px', padding: '12px 16px', fontSize: '14px',
                            color: '#374151', textDecoration: 'none', fontWeight: '600',
                            transition: 'all 0.2s', textAlign: 'center'
                          }}
                            onMouseEnter={(e) => { e.currentTarget.style.borderColor = '#667eea'; e.currentTarget.style.background = '#ede9fe'; }}
                            onMouseLeave={(e) => { e.currentTarget.style.borderColor = '#e5e7eb'; e.currentTarget.style.background = '#f9fafb'; }}>
                            {item.label}
                          </a>
                        ))}
                      </div>
                      <p style={{ fontSize: '11px', color: '#d1d5db', marginTop: '10px', marginBottom: 0 }}>
                        As an Amazon Associate we earn from qualifying purchases.
                      </p>
                    </div>
                  )}

                  {/* AdSense Ad Slot */}
                  <div style={{ marginTop: '30px' }}>
                    <ins className="adsbygoogle"
                      style={{ display: 'block' }}
                      data-ad-client="ca-pub-5002895754546578"
                      data-ad-slot="auto"
                      data-ad-format="auto"
                      data-full-width-responsive="true" />
                  </div>

                  <p style={{ marginTop: '30px', fontSize: '14px', color: '#9ca3af' }}>{disclaimer}</p>
                </div>
              </div>
            );
          }

          if (currentQuestion === null) {
            return (
              <div style={{ minHeight: 'calc(100vh - 80px)', background: gradient, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '40px 20px' }}>
                <div style={{ background: 'white', borderRadius: '24px', maxWidth: '700px', width: '100%', padding: '60px 40px', boxShadow: '0 20px 60px rgba(0,0,0,0.3)', textAlign: 'center', animation: 'slideUp 0.5s ease-out' }}>
                  <div style={{ fontSize: '100px', marginBottom: '30px' }}>🤒</div>
                  <h1 style={{ fontSize: '56px', fontFamily: '"Fredoka", sans-serif', color: '#1f2937', marginBottom: '20px', fontWeight: '700', lineHeight: '1.2' }}>Can I Stay Home?</h1>
                  <p style={{ fontSize: '20px', color: '#6b7280', marginBottom: '30px', lineHeight: '1.6' }}>The honest reality check.<br />Answer a few quick questions to find out.</p>
                  <div style={{ background: '#ede9fe', borderRadius: '12px', padding: '20px', marginBottom: '40px' }}>
                    <p style={{ fontSize: '18px', color: '#5b21b6', margin: 0, fontWeight: '700' }}>📊 {totalChecks !== null ? totalChecks.toLocaleString() : '...'} checks completed</p>
                  </div>
                  <button onClick={() => setCurrentQuestion(0)} style={{ background: gradient, color: 'white', border: 'none', borderRadius: '12px', padding: '20px 50px', fontSize: '22px', fontFamily: '"Fredoka", sans-serif', fontWeight: '600', cursor: 'pointer', transition: 'transform 0.2s', boxShadow: `0 4px 12px ${accentFrom}66` }}
                    onMouseEnter={(e) => e.target.style.transform = 'scale(1.05)'}
                    onMouseLeave={(e) => e.target.style.transform = 'scale(1)'}>
                    Start Check-Up ✓
                  </button>
                  <button onClick={onReset} style={{ display: 'block', margin: '20px auto 0', background: 'transparent', color: '#9ca3af', border: 'none', fontSize: '15px', cursor: 'pointer', fontFamily: '"Space Mono", monospace' }}>
                    ← Back to mode selection
                  </button>
                  <p style={{ marginTop: '30px', fontSize: '14px', color: '#9ca3af' }}>{disclaimer}</p>
                </div>
              </div>
            );
          }

          const q = questions[currentQuestion];
          const progress = ((currentQuestion + 1) / questions.length) * 100;
          return (
            <div style={{ minHeight: 'calc(100vh - 80px)', background: gradient, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '40px 20px' }}>
              <div style={{ background: 'white', borderRadius: '24px', maxWidth: '600px', width: '100%', padding: '40px', boxShadow: '0 20px 60px rgba(0,0,0,0.3)', animation: 'slideUp 0.3s ease-out' }}>
                <div style={{ marginBottom: '30px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px', fontSize: '14px', color: '#6b7280', fontWeight: '700' }}>
                    <span>Question {currentQuestion + 1} of {questions.length}</span>
                    <span>{Math.round(progress)}%</span>
                  </div>
                  <div style={{ height: '8px', background: '#e5e7eb', borderRadius: '999px', overflow: 'hidden' }}>
                    <div style={{ height: '100%', background: gradient, width: `${progress}%`, transition: 'width 0.3s ease' }} />
                  </div>
                </div>
                <div style={{ textAlign: 'center', marginBottom: '40px' }}>
                  <div style={{ fontSize: '80px', marginBottom: '20px' }}>{q.emoji}</div>
                  <h2 style={{ fontSize: '28px', fontFamily: '"Fredoka", sans-serif', color: '#1f2937', marginBottom: '10px', fontWeight: '700', lineHeight: '1.3' }}>{q.question}</h2>
                  {q.description && <p style={{ fontSize: '16px', color: '#6b7280', margin: 0 }}>{q.description}</p>}
                </div>
                <div style={{ display: 'grid', gap: '16px' }}>
                  <button onClick={() => handleAnswer('yes')} style={{ background: 'linear-gradient(135deg, #10b981 0%, #059669 100%)', color: 'white', border: 'none', borderRadius: '12px', padding: '20px', fontSize: '20px', fontFamily: '"Fredoka", sans-serif', fontWeight: '600', cursor: 'pointer', transition: 'transform 0.2s', boxShadow: '0 4px 12px rgba(16,185,129,0.3)' }}
                    onMouseEnter={(e) => e.target.style.transform = 'scale(1.02)'}
                    onMouseLeave={(e) => e.target.style.transform = 'scale(1)'}>
                    👍 Yes
                  </button>
                  <button onClick={() => handleAnswer('no')} style={{ background: 'linear-gradient(135deg, #ef4444 0%, #dc2626 100%)', color: 'white', border: 'none', borderRadius: '12px', padding: '20px', fontSize: '20px', fontFamily: '"Fredoka", sans-serif', fontWeight: '600', cursor: 'pointer', transition: 'transform 0.2s', boxShadow: '0 4px 12px rgba(239,68,68,0.3)' }}
                    onMouseEnter={(e) => e.target.style.transform = 'scale(1.02)'}
                    onMouseLeave={(e) => e.target.style.transform = 'scale(1)'}>
                    👎 No
                  </button>
                </div>
              </div>
            </div>
          );
        };

        // ─── KIDS QUIZ ─────────────────────────────────────────────────────────────
        // Question variants for freshness
        const pickVariant = (variants) => variants[Math.floor(Math.random() * variants.length)];
        
        const kidsQuestionBank = {
          fever: {
            id: 'fever',
            variants: [
              { question: 'Do you have a fever?', description: '(100.4°F / 38°C or higher)' },
              { question: 'Is your temperature high?', description: '(100.4°F / 38°C or higher)' },
              { question: 'Are you running a fever?', description: '(100.4°F / 38°C or higher)' }
            ],
            emoji: '🌡️',
            weight: 5
          },
          vomit: {
            id: 'vomit',
            variants: [
              { question: 'Have you thrown up in the last 24 hours?' },
              { question: 'Have you been vomiting today?' },
              { question: 'Did you throw up recently?' }
            ],
            emoji: '🤢',
            weight: 5
          },
          diarrhea: {
            id: 'diarrhea',
            variants: [
              { question: 'Do you have diarrhea?' },
              { question: 'Is your stomach upset with bathroom issues?' },
              { question: 'Are you having tummy troubles?' }
            ],
            emoji: '💩',
            weight: 4
          },
          contagious: {
            id: 'contagious',
            variants: [
              { question: 'Does the doctor think you have something contagious?', description: '(like strep, flu, pink eye, etc.)' },
              { question: 'Did a doctor say you might be contagious?', description: '(strep, flu, COVID, etc.)' },
              { question: 'Do you have a contagious illness?', description: '(that could spread to others)' }
            ],
            emoji: '🦠',
            weight: 5
          },
          pain: {
            id: 'pain',
            variants: [
              { question: 'Are you in serious pain?', description: "(not just 'my tummy feels weird')" },
              { question: 'Does something hurt really badly?', description: '(not just uncomfortable)' },
              { question: 'Are you dealing with real pain?', description: '(more than just "meh")' }
            ],
            emoji: '😫',
            weight: 4
          },
          sleep: {
            id: 'sleep',
            variants: [
              { question: 'Did you sleep terribly last night?', description: '(like, genuinely almost no sleep)' },
              { question: 'Did you barely get any sleep?', description: '(less than 4 hours)' },
              { question: 'Are you running on no sleep?', description: '(genuine exhaustion)' }
            ],
            emoji: '😴',
            weight: 2
          },
          energy: {
            id: 'energy',
            variants: [
              { question: 'Do you feel extremely tired or weak?', description: "(not normal 'I don't wanna' tired)" },
              { question: 'Are you totally exhausted?', description: "(actually can't function)" },
              { question: 'Do you feel like you have zero energy?', description: '(not just sleepy)' }
            ],
            emoji: '🥱',
            weight: 3
          },
          test: {
            id: 'test',
            variants: [
              { question: 'Is there a big test or presentation today?', description: '(just being honest...)' },
              { question: 'Do you have something important at school today?', description: '(test, project, etc.)' },
              { question: 'Is there something stressful happening at school today?', description: '(be real with us)' }
            ],
            emoji: '📝',
            weight: -2
          },
          cough: {
            id: 'cough',
            variants: [
              { question: 'Do you have a bad cough?', description: '(not just clearing your throat)' },
              { question: 'Are you coughing a lot?', description: '(more than just tickly)' },
              { question: 'Is your cough pretty bad?', description: "(not just a little throat clear)" }
            ],
            emoji: '🤧',
            weight: 3
          },
          headache: {
            id: 'headache',
            variants: [
              { question: 'Do you have a pounding headache?', description: '(worse than normal "meh" feeling)' },
              { question: 'Does your head hurt badly?', description: '(actual pain, not just tired)' },
              { question: 'Is your headache really bad?', description: '(more than just a little ache)' }
            ],
            emoji: '🤕',
            weight: 3
          },
          rash: {
            id: 'rash',
            variants: [
              { question: 'Do you have a rash or unexplained spots?', description: '(not just a random pimple)' },
              { question: 'Is there a weird rash on your skin?', description: '(spots, bumps, red patches)' },
              { question: 'Do you have any unusual skin issues?', description: '(rash, spots, bumps)' }
            ],
            emoji: '🔴',
            weight: 4
          },
          attention: {
            id: 'unicorn',
            variants: [
              { question: 'Did you see a unicorn this morning?', description: "(just checking if you're paying attention)" },
              { question: 'Can you fly like a superhero?', description: '(attention check!)' },
              { question: 'Did you eat a cloud for breakfast?', description: "(making sure you're reading)" },
              { question: 'Are you secretly a robot?', description: '(just testing if you're awake)' },
              { question: 'Do you have magical powers?', description: "(we know the answer to this)" }
            ],
            emoji: '🦄',
            weight: 0
          },
          stomach: {
            id: 'stomach',
            variants: [
              { question: 'Does your stomach hurt really bad?', description: '(like, doubled over bad)' },
              { question: 'Is your tummy pain really serious?', description: '(more than just uncomfortable)' },
              { question: 'Do you have major stomach pain?', description: '(really hurts, not just feels weird)' }
            ],
            emoji: '🤢',
            weight: 3
          }
        };

        const getKidsVerdict = (answers) => {
          let score = 0;
          Object.keys(kidsQuestionBank).forEach(key => {
            if (answers[kidsQuestionBank[key].id]) score += kidsQuestionBank[key].weight;
          });
          if (score >= 10) return { verdict: 'STAY HOME', color: '#dc2626', emoji: '🏠', message: "Yeah, you should probably stay home. You're dealing with some legit symptoms that either mean you're contagious or you genuinely need rest.", advice: "Rest up, drink fluids, and get better. If symptoms get worse, tell a parent to call the doctor." };
          if (score >= 5) return { verdict: 'MAYBE STAY HOME', color: '#f59e0b', emoji: '🤔', message: "This one's borderline. You have some symptoms, but not the really serious ones.", advice: "Talk it over with your parents. If you feel worse as the morning goes on, definitely stay home." };
          if (score >= 1) return { verdict: 'PROBABLY GO TO SCHOOL', color: '#2563eb', emoji: '🎒', message: "You're not feeling 100%, but it's not bad enough to skip. You can probably make it through the day.", advice: "Take it easy today. Let your teacher know if you start feeling worse." };
          return { verdict: 'GO TO SCHOOL', color: '#059669', emoji: '✅', message: "Nice try, but you're fine. This is classic 'I don't wanna' territory, not 'I'm actually sick.'", advice: "Time to face the music. You'll survive. We believe in you. 💪" };
        };

        // ─── ADULT WORK QUIZ ───────────────────────────────────────────────────────
        const workQuestionBank = {
          fever: {
            id: 'fever',
            variants: [
              { question: 'Do you have a fever?', description: '(100.4°F / 38°C or higher — yes, take your actual temperature)' },
              { question: 'Is your temperature elevated?', description: '(Actually check — 100.4°F / 38°C or higher)' }
            ],
            emoji: '🌡️',
            weight: 6
          },
          vomit: {
            id: 'vomit',
            variants: [
              { question: 'Have you vomited or had diarrhea in the last 12 hours?', description: '(Not the meal you regret. Actual illness.)' },
              { question: 'Are you dealing with vomiting or bathroom issues?', description: '(The kind that means you're actually sick)' }

            <div className="mobile-padding" style={{ maxWidth: '800px', margin: '0 auto', background: 'white', borderRadius: '24px', padding: '60px 50px', boxShadow: '0 20px 60px rgba(0,0,0,0.3)' }}>
              <h1 style={{ fontFamily: '"Fredoka", sans-serif', fontSize: '48px', color: '#1f2937', marginBottom: '10px', textAlign: 'center' }}>Privacy Policy</h1>
              <p style={{ fontSize: '14px', color: '#9ca3af', textAlign: 'center', marginBottom: '40px' }}>Last updated: February 2026</p>

              <div style={{ fontSize: '16px', lineHeight: '1.8', color: '#374151' }}>
                <h2 style={{ fontFamily: '"Fredoka", sans-serif', fontSize: '26px', color: '#1f2937', marginBottom: '12px' }}>Overview</h2>
                <p style={{ marginBottom: '24px' }}>This Privacy Policy describes how <strong>Can I Stay Home?</strong> ("we", "us", or "our") at <strong>www.canistayhome.com</strong> collects, uses, and shares information when you use our website. We take your privacy seriously and keep things simple.</p>

                <h2 style={{ fontFamily: '"Fredoka", sans-serif', fontSize: '26px', color: '#1f2937', marginBottom: '12px' }}>Information We Collect</h2>
                <p style={{ marginBottom: '12px' }}>We do <strong>not</strong> collect any personally identifiable information. Specifically:</p>
                <ul style={{ marginBottom: '24px', paddingLeft: '24px' }}>
                  <li style={{ marginBottom: '8px' }}>We do not require you to create an account or log in.</li>
                  <li style={{ marginBottom: '8px' }}>We do not store your quiz answers or results.</li>
                  <li style={{ marginBottom: '8px' }}>All quiz interactions happen entirely in your browser and are never sent to any server.</li>
                </ul>
                <p style={{ marginBottom: '24px' }}>We may collect anonymous, aggregated usage data (such as page views and general traffic patterns) through third-party analytics tools to help us improve the site.</p>

                <h2 style={{ fontFamily: '"Fredoka", sans-serif', fontSize: '26px', color: '#1f2937', marginBottom: '12px' }}>Google AdSense & Cookies</h2>
                <p style={{ marginBottom: '24px' }}>We use <strong>Google AdSense</strong> to display advertisements on this site. Google AdSense may use cookies and web beacons to serve ads based on your prior visits to this and other websites. You can opt out of personalised advertising by visiting <a href="https://www.google.com/settings/ads" target="_blank" rel="noopener noreferrer" style={{ color: '#667eea' }}>Google's Ads Settings</a>. For more information, see <a href="https://policies.google.com/privacy" target="_blank" rel="noopener noreferrer" style={{ color: '#667eea' }}>Google's Privacy Policy</a>.</p>

                <h2 style={{ fontFamily: '"Fredoka", sans-serif', fontSize: '26px', color: '#1f2937', marginBottom: '12px' }}>Amazon Affiliate Links</h2>
                <p style={{ marginBottom: '24px' }}>Can I Stay Home? is a participant in the <strong>Amazon Services LLC Associates Program</strong>, an affiliate advertising program designed to provide a means for sites to earn advertising fees by advertising and linking to Amazon.com. When you click an affiliate link and make a purchase, we may earn a small commission at no extra cost to you.</p>

                <h2 style={{ fontFamily: '"Fredoka", sans-serif', fontSize: '26px', color: '#1f2937', marginBottom: '12px' }}>Third-Party Links</h2>
                <p style={{ marginBottom: '24px' }}>Our site may contain links to third-party websites (such as Amazon). We are not responsible for the privacy practices or content of those sites. We encourage you to review their privacy policies.</p>

                <h2 style={{ fontFamily: '"Fredoka", sans-serif', fontSize: '26px', color: '#1f2937', marginBottom: '12px' }}>Children's Privacy</h2>
                <p style={{ marginBottom: '24px' }}>While our tool is designed to be used by or on behalf of children, we do not knowingly collect any personal information from children under 13. Since we collect no personal data at all, the site is safe to use for all ages.</p>

                <h2 style={{ fontFamily: '"Fredoka", sans-serif', fontSize: '26px', color: '#1f2937', marginBottom: '12px' }}>Changes to This Policy</h2>
                <p style={{ marginBottom: '24px' }}>We may update this Privacy Policy from time to time. Changes will be posted on this page with an updated date. Continued use of the site after changes constitutes acceptance of the new policy.</p>

                <h2 style={{ fontFamily: '"Fredoka", sans-serif', fontSize: '26px', color: '#1f2937', marginBottom: '12px' }}>Contact</h2>
                <p style={{ marginBottom: 0 }}>If you have any questions about this Privacy Policy, you can reach us via the contact information on our site.</p>
              </div>
            </div>
          </div>
        );

        // ─── FOOTER ────────────────────────────────────────────────────────────────
        const Footer = ({ setCurrentPage }) => (
          <footer style={{ background: '#0f172a', padding: '30px 20px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '16px' }}>
            <div style={{ fontFamily: '"Fredoka", sans-serif', fontSize: '16px', color: '#94a3b8', width: '100%', textAlign: 'center' }}>
              🏠 Can I Stay Home? · <span style={{ fontSize: '13px' }}>www.canistayhome.com</span>
            </div>
            <div style={{ display: 'flex', gap: '20px', flexWrap: 'wrap', justifyContent: 'center', width: '100%' }}>
              {[['About', 'about'], ['FAQ', 'faq'], ['Privacy Policy', 'privacy']].map(([label, page]) => (
                <button key={page} onClick={() => setCurrentPage(page)} style={{ background: 'transparent', border: 'none', color: '#64748b', fontSize: '14px', cursor: 'pointer', fontFamily: '"Space Mono", monospace', transition: 'color 0.2s' }}
                  onMouseEnter={(e) => e.target.style.color = '#94a3b8'}
                  onMouseLeave={(e) => e.target.style.color = '#64748b'}>
                  {label}
                </button>
              ))}
            </div>
            <p style={{ margin: 0, fontSize: '11px', color: '#334155', width: '100%', textAlign: 'center', lineHeight: '1.5' }}>
              Not medical advice. Not HR policy. Just an honest quiz. · As an Amazon Associate we earn from qualifying purchases.
            </p>
          </footer>
        );

        // ─── APP ROOT ──────────────────────────────────────────────────────────────
        const App = () => {
          const [currentPage, setCurrentPage] = useState('home');
          const [mode, setMode] = useState(null);       // 'kids' | 'adults'
          const [adultMode, setAdultMode] = useState(null); // 'work' | 'social'

          const resetAll = () => { setMode(null); setAdultMode(null); setCurrentPage('home'); };

          const renderContent = () => {
            if (currentPage === 'about') return <AboutPage />;
            if (currentPage === 'faq') return <FAQPage />;
            if (currentPage === 'privacy') return <PrivacyPage />;
            if (!mode) return <HomePage onSelect={setMode} />;
            if (mode === 'kids') return (
              <QuizShell questionBank={kidsQuestionBank} getVerdict={getKidsVerdict} onReset={() => setMode(null)}
                accentFrom="#667eea" accentTo="#764ba2" disclaimer="💡 For parents: This is a fun tool, not medical advice. Trust your parental instincts!" />
            );
            if (mode === 'adults') {
              if (!adultMode) return <AdultModeSelector onSelect={setAdultMode} onBack={() => setMode(null)} />;
              if (adultMode === 'work') return (
                <QuizShell questionBank={workQuestionBank} getVerdict={getWorkVerdict} onReset={() => setAdultMode(null)}
                  accentFrom="#0ea5e9" accentTo="#6366f1" disclaimer="Not a doctor. Not your HR department. Just a vibe check." showAffiliateLinks={true} />
              );
              if (adultMode === 'social') return (
                <QuizShell questionBank={socialQuestionBank} getVerdict={getSocialVerdict} onReset={() => setAdultMode(null)}
                  accentFrom="#f97316" accentTo="#ec4899" disclaimer="Not a therapist. Just a mirror. Be honest with yourself. 🪞" showAffiliateLinks={true} />
              );
            }
          };

          return (
            <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100vh' }}>
              <Navigation currentPage={currentPage} setCurrentPage={(p) => { setCurrentPage(p); if (p === 'home') { setMode(null); setAdultMode(null); } }} onLogoClick={resetAll} />
              <div style={{ flex: 1 }}>
                {renderContent()}
              </div>
              <Footer setCurrentPage={setCurrentPage} />
            </div>
          );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
